name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR="dist/mined-counter-${GITHUB_REF_NAME#v}.jar"
          test -f "$JAR"
          gh release create "$GITHUB_REF_NAME" "$JAR" \
            --title "Mined Counter $GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
