name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          JARS=(dist/mined-counter-${VERSION}+*.jar)
          if [ ${#JARS[@]} -eq 0 ]; then
            JARS=("dist/mined-counter-${VERSION}.jar")
          fi
          test -f "${JARS[0]}"
          gh release create "$GITHUB_REF_NAME" "${JARS[@]}" \
            --title "Mined Counter $GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
